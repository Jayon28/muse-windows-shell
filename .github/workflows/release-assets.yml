# 把发行包和所需的微软运行时安装包挂到已有的 GitHub Release 上。
# 手动触发（workflow_dispatch）；用仓库自带的 GITHUB_TOKEN 上传，不需要任何个人令牌。
name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish app (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish src/MuseShell/MuseShell.csproj -c Release -o publish-dist
          Copy-Item *.txt publish-dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path publish-dist/* -DestinationPath MuseForWindows-v1.0.0-win-x64.zip -Force

      - name: Download Microsoft runtimes (official links)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" -OutFile windowsdesktop-runtime-6.0-win-x64.exe
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile MicrosoftEdgeWebView2RuntimeInstallerX64.exe

      - name: Upload assets to the v1.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 MuseForWindows-v1.0.0-win-x64.zip windowsdesktop-runtime-6.0-win-x64.exe MicrosoftEdgeWebView2RuntimeInstallerX64.exe --clobber
